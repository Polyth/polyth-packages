# Checks every registry entry on pull requests. Zero dependencies: the
# validator is plain Node. Actions are pinned to full commit SHAs: the same
# pins Polyth's own CI uses (Polyth/Polyth .github/workflows). Confirm them
# against the actions' release tags before the first run, and keep them pinned.
name: Validate registry

on:
  pull_request:
    paths:
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - run: node scripts/validate-registry.mjs
